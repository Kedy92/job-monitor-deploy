services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmonitor
    ports:
      - "5433:5432"
    volumes:
      - jobmonitor_db:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/jobmonitor
    depends_on:
      - db

volumes:
  jobmonitor_db: